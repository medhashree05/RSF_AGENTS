[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-reversibility-prototype"
version = "0.1.0"
description = "Autonomous Reversibility of Anti-Patterns in LLM-Assisted Code Generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "docker>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["."]

